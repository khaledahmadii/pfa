name: Laravel Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix permissions
        run: sudo chown -R $USER:$USER .

      - name: Stop containers
        run: docker compose down || true

      - name: Build containers
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Wait for MySQL
        run: docker compose exec -T db sh -c 'until mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; do sleep 1; done'

      - name: Install Composer dependencies
        run: docker compose exec -T app composer install --no-dev --optimize-autoloader

      - name: Run database migrations
        run: docker compose exec -T app php artisan migrate --force

      - name: Clear Laravel cache
        run: |
          docker compose exec -T app php artisan config:clear
          docker compose exec -T app php artisan cache:clear
          docker compose exec -T app php artisan route:clear
          docker compose exec -T app php artisan view:clear

      - name: Optimize Laravel
        run: |
          docker compose exec -T app php artisan config:cache
          docker compose exec -T app php artisan route:cache
          docker compose exec -T app php artisan view:cache

      - name: Show status
        run: docker ps